<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardScore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <div id="home">

            <div class="logo">🃏</div>

            <h1>CardScore</h1>

            <p class="subtitle">
                Il tuo segnapunti per i giochi di carte
            </p>

            <h2>Scegli il gioco</h2>

            <div class="games">

                <button class="game-button" onclick="scegliGioco('UNO')">
                    🟦 UNO
                </button>

                <button class="game-button" onclick="scegliGioco('Pili Pili')">
                    🟣 Pili Pili
                </button>

                <button class="game-button" onclick="scegliGioco('Scala 40')">
                    🟢 Scala 40
                </button>

                <button class="game-button" onclick="scegliGioco('Scopa')">
                    🟡 Scopa
                </button>

            </div>

        </div>


        <div id="nuova-partita" style="display:none">

            <button onclick="tornaHome()">← Indietro</button>

            <h1 id="titolo-gioco"></h1>

            <p class="subtitle">
                Inserisci i giocatori
            </p>

            <input
                id="nome-giocatore"
                type="text"
                placeholder="Nome giocatore"
            >

            <button onclick="aggiungiGiocatore()">
                + Aggiungi giocatore
            </button>

            <div id="lista-giocatori"></div>

            <button onclick="iniziaPartita()">
                🎮 Inizia partita
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
