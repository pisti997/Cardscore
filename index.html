<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardScore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- ========================= -->
        <!-- HOME -->
        <!-- ========================= -->

        <div id="home">

            <div class="logo">🃏</div>

            <h1>CardScore</h1>

            <p class="subtitle">
                Il tuo segnapunti per i giochi di carte
            </p>

            <h2>Scegli il gioco</h2>

            <div class="games">

                <button class="game-button" onclick="scegliGioco('UNO')">
                    🟦 UNO
                </button>

                <button class="game-button" onclick="scegliGioco('Pili Pili')">
                    🟣 Pili Pili
                </button>

                <button class="game-button" onclick="scegliGioco('Scala 40')">
                    🟢 Scala 40
                </button>

                <button class="game-button" onclick="scegliGioco('Scopa')">
                    🟡 Scopa
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- NUOVA PARTITA -->
        <!-- ========================= -->

        <div id="nuova-partita" style="display:none">

            <button onclick="tornaHome()">
                ← Indietro
            </button>

            <h1 id="titolo-gioco"></h1>

            <p class="subtitle">
                Crea la tua partita
            </p>


            <!-- GIOCATORI -->

            <h2>Giocatori</h2>

            <input
                id="nome-giocatore"
                type="text"
                placeholder="Nome giocatore"
            >

            <button onclick="aggiungiGiocatore()">
                + Aggiungi giocatore
            </button>

            <div id="lista-giocatori"></div>


            <!-- OBIETTIVO -->

            <h2>Obiettivo partita</h2>

            <select
                id="obiettivo"
                onchange="cambiaObiettivo()"
            >

                <option value="100">
                    100 punti
                </option>

                <option value="200">
                    200 punti
                </option>

                <option value="300">
                    300 punti
                </option>

                <option value="500" selected>
                    500 punti
                </option>

                <option value="1000">
                    1000 punti
                </option>

                <option value="personalizzato">
                    Personalizzato
                </option>

            </select>


            <input
                id="obiettivo-personalizzato"
                type="number"
                placeholder="Inserisci obiettivo"
                min="1"
                style="display:none"
            >


            <button onclick="iniziaPartita()">
                🎮 Inizia partita
            </button>

        </div>


        <!-- ========================= -->
        <!-- PARTITA -->
        <!-- ========================= -->

        <div id="partita" style="display:none">

            <button onclick="tornaHome()">
                ← Esci
            </button>


            <h1 id="titolo-partita"></h1>

            <p class="subtitle" id="numero-mano">
                Turno 1
            </p>


            <!-- OBIETTIVO -->

            <p id="obiettivo-display">
                🎯 Obiettivo: 500 punti
            </p>


            <!-- TABELLONE -->

            <h2>Punteggio</h2>

            <div id="tabellone"></div>


            <!-- NUOVO TURNO -->

            <h2>Nuovo turno</h2>


            <label for="giocatore-vincitore">
                🏆 Vincitore
            </label>

            <select id="giocatore-vincitore">
            </select>


            <label for="punti">
                Punti ottenuti
            </label>

            <input
                id="punti"
                type="number"
                placeholder="Inserisci punti"
                min="0"
            >


            <button onclick="aggiungiMano()">
                ➕ Nuovo turno
            </button>


            <button onclick="annullaUltimoTurno()">
                ↩️ Annulla ultimo turno
            </button>


            <!-- STORICO -->

            <div id="storico">
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
