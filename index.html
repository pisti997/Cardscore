<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardScore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <!-- ========================= -->
    <!-- HOME -->
    <!-- ========================= -->

    <div id="home">

        <div class="logo">🃏</div>

        <h1>CardScore</h1>

        <p class="subtitle">
            Il tuo segnapunti per i giochi di carte
        </p>

        <h2>Scegli il gioco</h2>

        <div class="games">

            <button class="game-button" onclick="scegliGioco('UNO')">
                🟦 UNO
            </button>

            <button class="game-button" onclick="scegliGioco('Pili Pili')">
                🟣 Pili Pili
            </button>

            <button class="game-button" onclick="scegliGioco('Scala 40')">
                🟢 Scala 40
            </button>

            <button class="game-button" onclick="scegliGioco('Scopa')">
                🟡 Scopa
            </button>

        </div>


        <!-- PARTITA IN CORSO -->

        <div id="partita-in-corso" style="display:none">

            <h2>🔄 Partita in corso</h2>

            <div id="partita-salvata"></div>

            <button onclick="continuaPartita()">
                ▶️ Continua partita
            </button>

            <button onclick="nuovaPartita()">
                🆕 Nuova partita
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- NUOVA PARTITA -->
    <!-- ========================= -->

    <div id="nuova-partita" style="display:none">

        <button onclick="tornaHome()">
            ← Indietro
        </button>

        <h1 id="titolo-gioco"></h1>

        <p class="subtitle">
            Crea la tua partita
        </p>


        <h2>Giocatori</h2>

        <input
            id="nome-giocatore"
            type="text"
            placeholder="Nome giocatore"
        >

        <button onclick="aggiungiGiocatore()">
            + Aggiungi giocatore
        </button>

        <div id="lista-giocatori"></div>


        <h2>Obiettivo partita</h2>

        <select id="obiettivo">

            <option value="100">
                100 punti
            </option>

            <option value="200">
                200 punti
            </option>

            <option value="300">
                300 punti
            </option>

            <option value="500" selected>
                500 punti
            </option>

            <option value="1000">
                1000 punti
            </option>

            <option value="personalizzato">
                Personalizzato
            </option>

        </select>


        <div id="campo-personalizzato" style="display:none">

            <input
                id="obiettivo-personalizzato"
                type="number"
                min="1"
                placeholder="Inserisci obiettivo"
            >

        </div>


        <button onclick="iniziaPartita()">
            🎮 Inizia partita
        </button>

    </div>


    <!-- ========================= -->
    <!-- PARTITA -->
    <!-- ========================= -->

    <div id="partita" style="display:none">

        <button onclick="tornaHome()">
            ← Esci
        </button>


        <h1 id="titolo-partita"></h1>

        <p class="subtitle" id="numero-mano">
            Turno 1
        </p>


        <p id="obiettivo-display">
            🎯 Obiettivo: 500 punti
        </p>


        <h2>Punteggio</h2>

        <div id="tabellone"></div>


        <h2>Nuovo turno</h2>


        <label for="giocatore-vincitore">
            🏆 Vincitore
        </label>

        <select id="giocatore-vincitore">
        </select>


        <label for="punti">
            Punti ottenuti
        </label>

        <input
            id="punti"
            type="number"
            min="0"
            placeholder="Inserisci punti"
        >


        <button onclick="aggiungiMano()">
            ➕ Nuovo turno
        </button>


        <button onclick="annullaUltimoTurno()">
            ↩️ Annulla ultimo turno
        </button>


        <div id="storico"></div>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
